name: Go CI and Release

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    if: github.ref_type == 'tag'
    name: Validate and package ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Test, build, and package
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          if [[ "$TARGET_OS" == darwin ]]; then
            export CGO_ENABLED=1
          fi
          go test ./...
          mkdir -p build dist
          asset="termihomo-${TARGET_OS}-${TARGET_ARCH}"
          binary=termihomo
          if [[ "$TARGET_OS" == windows ]]; then
            binary="${asset}.exe"
          fi
          go build -trimpath -ldflags="-s -w -X github.com/Nyakooo/termihomo/internal/version.Value=$GITHUB_REF_NAME" \
            -o "build/$binary" ./cmd/termihomo
          TERMIHOMO_SMOKE_BINARY="../build/$binary" go test -count=1 -run '^TestReleaseBinary$' ./test
          if [[ "$TARGET_OS" == windows ]]; then
            mv "build/$binary" dist/
          else
            tar -czf "dist/${asset}.tar.gz" -C build "$binary"
          fi
      - name: Build Android ARM64
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          export GOOS=android GOARCH=arm64 CGO_ENABLED=1
          export CC="${ANDROID_NDK_LATEST_HOME:?}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          go build -trimpath \
            -ldflags="-s -w -X github.com/Nyakooo/termihomo/internal/version.Value=$GITHUB_REF_NAME -extldflags=-Wl,-z,max-page-size=16384,-z,common-page-size=16384" \
            -o build/termihomo-android-arm64 ./cmd/termihomo
          tar -czf dist/termihomo-android-arm64.tar.gz -C build termihomo-android-arm64
      - name: Smoke test Unix installer
        if: matrix.os != 'windows'
        run: |
          sh test/install-smoke.sh "dist/termihomo-${TARGET_OS}-${TARGET_ARCH}.tar.gz"
          if [[ "$TARGET_OS" == linux && "$TARGET_ARCH" == amd64 ]]; then
            sh test/install-smoke.sh dist/termihomo-android-arm64.tar.gz
          fi
      - name: Smoke test Windows installer
        if: matrix.os == 'windows'
        shell: powershell
        run: ./test/install-smoke.ps1 "dist/termihomo-windows-$env:TARGET_ARCH.exe"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/termihomo-*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum termihomo-* > SHA256SUMS
          notes_file="$GITHUB_WORKSPACE/.github/release-notes/$GITHUB_REF_NAME.md"
          if [[ ! -s "$notes_file" ]]; then
            notes_file="$(mktemp)"
            previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
            range="${previous:+$previous..}$GITHUB_REF_NAME"
            git log "$range" --format='- %s (%h)' > "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file "$notes_file" termihomo-* SHA256SUMS
