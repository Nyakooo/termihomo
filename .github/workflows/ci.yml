name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Build and smoke test
        run: |
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          go build -o "$RUNNER_TEMP/termihomo" ./cmd/termihomo
          smoke_home="$(mktemp -d)"
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME
          "$RUNNER_TEMP/termihomo" --help
          "$RUNNER_TEMP/termihomo" version
          env HOME="$smoke_home" "$RUNNER_TEMP/termihomo" init
          test -d "$smoke_home/.config/termihomo"
          test -d "$smoke_home/.local/share/termihomo"
          test -d "$smoke_home/.local/state/termihomo/logs"
      - name: Run Mihomo and terminal acceptance
        run: python3 test/smoke.py "$RUNNER_TEMP/termihomo"
